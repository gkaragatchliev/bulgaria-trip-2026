<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulgaria Trip 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇧🇬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Serif+Display:ital@0;1&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>
  <div class="progress-bar" aria-hidden="true"></div>
  <header class="hero">
    <canvas id="g-particles" class="g-canvas" aria-hidden="true"></canvas>
    <div class="hero-inner">
      <div class="hero-actions">
        <div class="lang-bar">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="bg">BG</button>
        </div>
        <button type="button" id="plan-toggle" class="plan-toggle-btn">
          <span class="plan-icon">&#9998;</span> <span class="plan-label">Plan Activity</span>
        </button>
      </div>
      <p class="hero-kicker">October 2026 &middot; Bulgaria</p>
      <h1>Bulgaria Trip 2026</h1>
      <p class="hero-sub">October 8 - 26, 2026</p>
      <p class="hero-travelers"></p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div id="overview" class="overview" aria-label="Trip stops"></div>
        <div class="route-map reveal" aria-hidden="true">
          <svg id="route-map" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Route map: Sofia, Plovdiv, Melnik">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#d9efeb" />
                <stop offset="100%" stop-color="#f4f9f7" />
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="600" height="300" rx="12" fill="url(#bgGrad)" />
            <!-- Static fallback; lines + dots get redrawn hand-drawn style by rough.js when available -->
            <line class="static-line" x1="130" y1="120" x2="380" y2="195" stroke="#14766d" stroke-width="2" stroke-dasharray="6,4" />
            <line class="static-line" x1="130" y1="120" x2="155" y2="248" stroke="#9f1239" stroke-width="2" stroke-dasharray="6,4" />
            <!-- Sofia -->
            <circle class="static-dot" cx="130" cy="120" r="8" fill="var(--loc-sofia)" filter="url(#glow)" />
            <circle class="static-core" cx="130" cy="120" r="3.5" fill="#fff" />
            <text x="130" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="var(--loc-sofia)" font-family="Inter, system-ui, sans-serif">Sofia</text>
            <!-- Plovdiv -->
            <circle class="static-dot" cx="380" cy="195" r="8" fill="var(--loc-plovdiv)" filter="url(#glow)" />
            <circle class="static-core" cx="380" cy="195" r="3.5" fill="#fff" />
            <text x="380" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="var(--loc-plovdiv)" font-family="Inter, system-ui, sans-serif">Plovdiv</text>
            <!-- Melnik -->
            <circle class="static-dot" cx="155" cy="248" r="8" fill="var(--loc-melnik)" filter="url(#glow)" />
            <circle class="static-core" cx="155" cy="248" r="3.5" fill="#fff" />
            <text x="155" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="var(--loc-melnik)" font-family="Inter, system-ui, sans-serif">Melnik</text>
          </svg>
        </div>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>

    <section id="calendar-section" class="section calendar-section hidden">
      <div class="container">
        <h2 class="section-title">
          <span class="section-title-text">Trip Calendar</span>
          <span class="section-title-bg" aria-hidden="true">CAL</span>
        </h2>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-dot legend-travel"></span> Travel</span>
          <span class="legend-item"><span class="legend-dot legend-family"></span> Family / Booked</span>
          <span class="legend-item"><span class="legend-dot legend-free"></span> Free</span>
        </div>
        <div id="calendar" class="calendar"></div>

        <h3 class="form-title">Propose an Activity</h3>
        <p class="form-subtitle">Pick a free day, suggest something fun. George and Harue will confirm.</p>
        <form id="activity-form" class="activity-form">
          <div class="form-row">
            <label for="plan-day">Day</label>
            <select id="plan-day" required>
              <option value="">Select a day...</option>
            </select>
          </div>
          <div class="form-row">
            <label for="plan-who">Who</label>
            <select id="plan-who" required>
              <option value="">Who is this for?</option>
              <option value="nephew">Nephew</option>
              <option value="niece">Niece</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div class="form-row">
            <label for="plan-activity">Activity</label>
            <input type="text" id="plan-activity" placeholder="e.g. Visit the zoo, go hiking, water park..." required />
          </div>
          <button type="submit" class="plan-submit-btn">Propose via Email</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>George &amp; Harue &middot; Bulgaria Trip 2026</p>
    </div>
  </footer>

  <script src="vendor/splitting.min.js?v=8"></script>
  <script src="vendor/rough.min.js?v=8"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
